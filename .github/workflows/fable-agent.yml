name: FABLE Agent

on:
  schedule:
    # Every 6 hours — 4 genuine commits per day
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fable-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run FABLE agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          output=$(python3 scripts/fable_commit.py)
          echo "$output"
          # Extract commit message line
          commit_msg=$(echo "$output" | grep '^COMMIT_MSG=' | cut -d= -f2-)
          echo "commit_msg=$commit_msg" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "AESOP"
          git config user.email "aesop@fablechain.xyz"
          git add docs/dev-log.md CHANGELOG.md
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "${{ steps.agent.outputs.commit_msg }}"
          git push
